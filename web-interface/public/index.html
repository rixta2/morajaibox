<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Box Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🧩 Puzzle Box Manager</span>
            <div class="d-flex">
                <span class="badge bg-success me-2" id="connectionStatus">Connected</span>
                <span class="badge bg-info" id="boxCount">0 Boxes</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Connected Boxes</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="refreshBoxes()">🔄</button>
                    </div>
                    <div class="card-body p-0">
                        <div id="boxList" class="list-group list-group-flush">
                            <!-- Boxes will be populated here -->
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Puzzles</h5>
                        <button class="btn btn-sm btn-success" onclick="showPuzzleCreator()">➕</button>
                    </div>
                    <div class="card-body p-0">
                        <div id="puzzleList" class="list-group list-group-flush">
                            <!-- Puzzles will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <div class="tab-content">
                    <!-- Dashboard Tab -->
                    <div class="tab-pane fade show active" id="dashboard">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Live Dashboard1</h5>
                            </div>
                            <div class="card-body">
                                <div id="dashboardGrid" class="row">
                                    <!-- Dashboard content will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Puzzle Creator Modal -->
    <div class="modal fade" id="puzzleCreatorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Puzzle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="puzzleForm">
                        <div class="mb-3">
                            <label class="form-label">Puzzle Name</label>
                            <input type="text" class="form-control" id="puzzleName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="puzzleDescription" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Solve Color</label>
                            <select class="form-select" id="solveColor">
                                <option value="0">Pink</option>
                                <option value="1">Red</option>
                                <option value="2">Orange</option>
                                <option value="3">Blue</option>
                                <option value="4">Violet</option>
                                <option value="5">Yellow</option>
                                <option value="6">White</option>
                                <option value="7">Black</option>
                                <option value="8">Brown</option>
                                <option value="9">Green</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Button Layout (3x3 Grid)</label>
                            <div id="buttonGrid" class="button-grid">
                                <!-- 3x3 grid will be generated here -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="savePuzzle()">Save Puzzle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Deploy Modal -->
    <div class="modal fade" id="deployModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Deploy Puzzle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Select boxes to deploy puzzle to:</p>
                    <div id="deployBoxList">
                        <!-- Box checkboxes will be populated here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="deployPuzzle()">Deploy</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
