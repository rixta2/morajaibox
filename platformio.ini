[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    fastled/FastLED@^3.6.0
    ArduinoJson@^7.0.0
    AsyncTCP@^1.1.1
    ESP Async WebServer@^1.2.3
monitor_speed = 115200
upload_speed = 115200

; OTA environment - copy this section and modify IP for each box
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    fastled/FastLED@^3.6.0
    ArduinoJson@^7.0.0
    AsyncTCP@^1.1.1
    ESP Async WebServer@^1.2.3
upload_protocol = espota
upload_port = 192.168.1.178  ; Change to your ESP32's IP address
upload_flags = 
    --auth=puzzle123            ; Change to your OTA password
monitor_speed = 115200